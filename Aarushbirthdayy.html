<!DOCTYPE html>
<html>
<head>
    <title>My Birthday 🎉</title>

    <style>
        body {
            text-align: center;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            font-family: Arial;
            margin: 0;
        }

        h1 {
            color: #d84315;
            margin-top: 20px;
        }

        p {
            font-size: 18px;
        }

        /* Slider */
        .slider {
            width: 90%;
            max-width: 300px;
            height: 250px;
            margin: auto;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        .slides {
            display: flex;
            width: 500%;
            animation: slide 15s infinite;
        }

        .slides img {
            width: 100%;
                height: 250px;
                object-fit: cover;
        }

        @keyframes slide {
            0% { margin-left: 0; }
            20% { margin-left: 0; }
            25% { margin-left: -100%; }
            45% { margin-left: -100%; }
            50% { margin-left: -200%; }
            70% { margin-left: -200%; }
            75% { margin-left: -300%; }
            95% { margin-left: -300%; }
            100% { margin-left: -400%; }
        }

        .btn {
            display: inline-block;
            padding: 15px 25px;
            background-color: #ff7043;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #e64a19;
        }
    </style>
</head>

<body>

<h1>🎉 It's My Birthday 🎉</h1>

<p>Hello everyone 😄<br>
Welcome to my special day!</p>

<!-- Image Slider -->
<div class="slider">
    <div class="slides">
        <img src="photo1.jpg">
        <img src="photo2.jpg">
        <img src="photo3.jpg">
        <img src="photo4.jpg">
        <img src="photo5.jpg">  
    </div>
</div>

<p>Tap below to celebrate with me 🍬</p>

<a href="sweets.html" class="btn">🥳🎉🎊🎂🎊🎉</a>

</body>
</html>
