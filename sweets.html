<!DOCTYPE html>
<html>
<head>
    <title>Birthday Wishes 🎉</title>

    <style>
        body {
            text-align: center;
            background: linear-gradient(to right, #ffe0b2, #ffccbc);
            font-family: Arial;
            margin: 0;
        }

        h1 {
            color: #bf360c;
            margin-top: 20px;
        }

        p {
            font-size: 18px;
        }

        /* Slider */
        .slider {
            width: 90%;
            max-width: 350px;
            height: 250px;
            margin: auto;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        .slides {
            display: flex;
            width: 1000%;
            animation: slide 25s infinite;
        }

        .slides img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        @keyframes slide {
            0% { margin-left: 0; }
            10% { margin-left: 0; }

            15% { margin-left: -100%; }
            25% { margin-left: -100%; }

            30% { margin-left: -200%; }
            40% { margin-left: -200%; }

            45% { margin-left: -300%; }
            55% { margin-left: -300%; }

            60% { margin-left: -400%; }
            70% { margin-left: -400%; }

            75% { margin-left: -500%; }
            85% { margin-left: -500%; }

            90% { margin-left: -600%; }
            100% { margin-left: -600%; }
        }

        .box {
            margin: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        .qr img {
            width: 250px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>Warm Birthday Greetings 🙏🎉</h1>

<p>
These are some special memories with my loved ones ❤️<br>
Your blessings mean everything to me
</p>

<!-- 10 Image Slider -->
<div class="slider">
    <div class="slides">
        <img src="photo6.jpg">
        <img src="photo7.jpg">
        <img src="photo8.jpg">
        <img src="photo9.jpg">
        <img src="photo10.jpg">
        <img src="photo11.jpg">
        <img src="photo12.jpg">
        <img src="photo13.jpg">
        <img src="photo14.jpg">
        <img src="photo15.jpg">
    </div>
</div>

<div class="box">
    <p>
        If you wish to bless me 🎁<br>
        You can send your love here 💸<br><br>

        Every blessing means a lot ❤️
    </p>

    <div class="qr">
        <img src="qr.png" alt="UPI QR">
    </div>

    <p>
        Scan & send your blessings 💸<br>
        And don’t forget to message me 😄
    </p>
</div>

</body>
</html>
